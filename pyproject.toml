[project]
name = "cizhu-cixiu"
version = "0.1.0"
description = "词修：来源语料 → 纯词库物料"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pyright==1.1.414",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cixiu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
